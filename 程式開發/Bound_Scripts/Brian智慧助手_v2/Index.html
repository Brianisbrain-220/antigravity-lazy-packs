<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #020408; margin: 0; padding: 15px; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; color: #cfd8dc; overflow-x: hidden; }
    body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background-image: radial-gradient(1.2px 1.2px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)); background-size: 200px 200px; opacity: 0.3; }
    .energy-panel { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
    .energy-core { flex: 1; min-width: 140px; padding: 10px 15px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .core-a { background: rgba(155, 89, 182, 0.2); color: #e0b0ff; box-shadow: 0 0 15px rgba(155, 89, 182, 0.3); border-color: #9b59b2; }
    .core-b { background: rgba(243, 156, 18, 0.2); color: #f39c12; box-shadow: 0 0 15px rgba(243, 156, 18, 0.3); border-color: #f39c12; }
    .card { transition: all 0.3s; cursor: pointer; border-radius: 15px; border: 1px solid rgba(0, 210, 255, 0.15); background: rgba(13, 17, 23, 0.85); box-shadow: 0 8px 25px rgba(0,0,0,0.5); margin-bottom: 15px; overflow: hidden; height: 100%; }
    .card:hover { transform: translateY(-3px); border-color: rgba(0, 210, 255, 0.5); }
    .thumb-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .card-body { color: #e9eef3 !important; user-select: text !important; -webkit-user-select: text !important; padding: 15px; }
    .card-body *, [id^="detail-"] { color: #e9eef3 !important; line-height: 1.7; font-size: 0.95rem; word-break: break-word; }
    .card-body .text-muted { color: #b0b7bf !important; }
    .card-body .fw-bold { color: #ffd166 !important; }
    .card-body a, .card-body a:visited { color: #66d9ff !important; text-decoration: underline !important; pointer-events: auto !important; position: relative; z-index: 9999; }
    .btn-map { color: #ffffff !important; border-color: #ff6b81 !important; background: rgba(255, 107, 129, 0.12) !important; font-weight: bold; margin-top: 10px; pointer-events: auto !important; position: relative; z-index: 9999; }
    .btn-map:hover { background-color: #ff6b81 !important; color: #111 !important; }
    .detail-link { display:block !important; margin-top:10px; pointer-events:auto !important; position:relative !important; z-index:9999 !important; }
    .loc-card { border-color: rgba(255, 107, 129, 0.35); }
    .section-title { font-size: 1rem; color: #8ecae6; font-weight: bold; border-left: 4px solid; padding-left: 10px; margin: 30px 0 15px 0; }
    .badge-tags { color: #90ee90; font-size: 0.8rem; margin-bottom: 8px; display: block; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <h3 class="text-center mt-3 mb-4" style="color: #cfd8dc; font-size: 1.4rem;">🪐 <?= botName ?> 指揮中心</h3>
    <div class="text-center small mb-2" style="color:#607d8b;">版本：V3.9.0 擴充版</div>
    <div class="toolbar">
      <span class="badge text-bg-secondary">安全輸出</span>
      <span class="badge text-bg-secondary">唯一ID</span>
      <span class="badge text-bg-secondary">可回滾</span>
    </div>
    <div class="energy-panel">
      <div class="energy-core core-a">🛡️ 救援 A: <?= 20 - usageA ?>/20 次</div>
      <div class="energy-core core-b">⚡ 閃電 B: 約 <?= usageB ?>k / 100k</div>
    </div>
    <div id="loading" class="text-center my-5"><div class="spinner-border text-warning"></div><div class="mt-3 small">正在取得星際數據...</div></div>
    <div class="section-title" style="border-color: #ff4757;">🌍 旅遊口袋名單 (口袋地圖)</div>
    <div id="locationList" class="row g-3"></div>
    <div class="section-title" style="border-color: #00d2ff;">📚 知識倉庫與資源</div>
    <div id="activeList" class="row g-3"></div>
    <hr class="my-5" style="border-color: rgba(255,255,255,0.1);">
    <div class="text-center small mb-5" style="color:#607d8b">📁 封存空間站</div>
    <div id="archivedList" class="row g-3"></div>
  </div>

  <script>
    function loadData() { google.script.run.withSuccessHandler(render).getDashboardData(); }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function nl2brSafe(str) { return escapeHtml(str).replace(/\n/g, '<br>'); }
    function safeUrl(url) { const s = String(url || '').trim(); return /^https?:\/\/\//i.test(s) ? s : ''; }
    function mapsUrl(addr) { return addr ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr) : ''; }

    function setupCardDetails() {
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', function(e) {
          if (e.target.closest('a')) return;
          const detail = card.querySelector('[id^="detail-"]');
          if (!detail) return;
          if (window.getSelection().toString().length > 3) return;
          detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
        });
      });
    }

    function render(data) {
      document.getElementById('loading').style.display = 'none';
      const active = document.getElementById('activeList');
      const archived = document.getElementById('archivedList');
      const locations = document.getElementById('locationList');
      active.innerHTML = '';
      archived.innerHTML = '';
      locations.innerHTML = '';

      const locationItems = (data.locations || []).filter(item => String(item.status) === '0').reverse();
      if (locationItems.length === 0) locations.innerHTML = '<div class="text-center text-muted py-3 small w-100">目前尚無收藏地點</div>';

      locationItems.forEach(item => {
        const addr = String(item.location || '').trim();
        const mapUrl = mapsUrl(addr);
        locations.innerHTML += `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card loc-card">
              <div class="card-body">
                <div class="fw-bold mb-2" style="color: #ffd166;">📍 ${escapeHtml(item.title)}</div>
                <div class="small" style="color:#b0b7bf;">📅 ${escapeHtml(item.time)} | ${escapeHtml(item.location)}</div>
                <div id="detail-${escapeHtml(item.id)}" style="display:none; position:relative; z-index:9998;" class="mt-2 small border-top border-secondary pt-2">
                  <div style="color:#e9eef3;">${nl2brSafe(item.summary)}</div><br>
                  ${mapUrl ? `<a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-danger btn-map w-100 detail-link" onclick="event.stopPropagation();">🗺️ 開啟 Google Map 搜尋</a>` : ''}
                </div>
              </div>
            </div>
          </div>`;
      });

            [...(data.knowledge || [])].reverse().forEach(item => {
        const rawUrl = String(item.url || '').trim();
        const hasValidUrl = rawUrl ? (rawUrl.startsWith('http') ? rawUrl : ('https://' + rawUrl)) : '';
        const safeThumb = safeUrl(item.thumb);
        const tagHtml = (item.tags && item.tags !== 'null' && item.tags !== '') ? `<span class="badge-tags">🏷️ ${escapeHtml(item.tags)}</span>` : '';
        const cardHtml = `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card">
              ${safeThumb ? `<img src="${safeThumb}" class="thumb-img" loading="lazy" referrerpolicy="no-referrer">` : ''}
              <div class="card-body">
                <div class="fw-bold mb-2" style="color: #ffd166;">${escapeHtml(item.title)}</div>
                <div class="small" style="color:#b0b7bf;">📅 ${escapeHtml(item.time)} | ${escapeHtml(item.category)}</div>
                ${tagHtml}
                <div id="detail-${escapeHtml(item.id)}" style="display:none; position:relative; z-index:9998;" class="mt-2 small border-top border-secondary pt-2">
                  <div style="color:#e9eef3;">${nl2brSafe(item.summary)}</div><br><br>
                  ${hasValidUrl ? `<a href="${hasValidUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-info w-100 detail-link" onclick="event.stopPropagation();" style="pointer-events:auto !important; position:relative !important; z-index:99999 !important; display:block !important;">🔗 查看來源</a>` : ''}
                </div>
              </div>
            </div>
          </div>`;
        if (String(item.status) === '0') active.innerHTML += cardHtml; else archived.innerHTML += cardHtml;
      });
      setupCardDetails();
    }

    window.onload = loadData;
  </script>
</body>
</html>
